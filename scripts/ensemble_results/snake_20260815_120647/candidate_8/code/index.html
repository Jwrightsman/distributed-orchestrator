<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Snake</title>
    <style>
        body {
            background-color: #050505;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        canvas {
            border: 2px solid #333;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
            background-color: #000;
        }

        #ui-layer {
            display: flex;
            justify-content: space-between;
            width: 400px;
            margin-bottom: 10px;
            color: #0f0;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 5px #0f0;
        }

        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            z-index: 10;
        }

        #game-over-screen h1 {
            font-size: 48px;
            margin: 0 0 20px 0;
            color: #f00;
            text-shadow: 0 0 10px #f00;
        }

        #game-over-screen p {
            margin: 0 0 30px 0;
            font-size: 24px;
        }

        button {
            background: transparent;
            border: 2px solid #0f0;
            color: #0f0;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 0 0 5px #0f0;
            box-shadow: 0 0 5px #0f0;
            transition: all 0.2s;
        }

        button:hover {
            background-color: #0f0;
            color: #000;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <span>Score: <span id="score">0</span></span>
        <span>High Score: <span id="high-score">0</span></span>
    </div>

    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div id="game-over-screen">
        <h1>GAME OVER</h1>
        <p>Final Score: <span id="final-score">0</span></p>
        <button id="restart-btn">Restart Game</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('high-score');
        const finalScoreEl = document.getElementById('final-score');
        const gameOverScreen = document.getElementById('game-over-screen');
        const restartBtn = document.getElementById('restart-btn');

        const TILE_SIZE = 20;
        const TILE_COUNT = canvas.width / TILE_SIZE;
        const GAME_SPEED = 100; // ms per frame

        // Game State
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        highScoreEl.textContent = highScore;

        let velocity = { x: 0, y: 0 };
        let snake = [];
        let food = { x: 0, y: 0 };
        let gameInterval = null;
        let isGameOver = false;
        let isGameRunning = false;

        // Initialize Snake
        function initSnake() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            velocity = { x: 1, y: 0 };
        }

        // Initialize Food
        function placeFood() {
            let validPosition = false;
            while (!validPosition) {
                food.x = Math.floor(Math.random() * TILE_COUNT);
                food.y = Math.floor(Math.random() * TILE_COUNT);

                // Ensure food doesn't spawn on snake
                validPosition = true;
                for (let part of snake) {
                    if (part.x === food.x && part.y === food.y) {
                        validPosition = false;
                        break;
                    }
                }
            }
        }

        // Input Handling
        document.addEventListener('keydown', keyDownHandler);
        restartBtn.addEventListener('click', resetGame);

        function keyDownHandler(event) {
            // Prevent scrolling
            if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight", "Space"].indexOf(event.code) > -1) {
                event.preventDefault();
            }

            const LEFT_KEY = 37;
            const RIGHT_KEY = 39;
            const UP_KEY = 38;
            const DOWN_KEY = 40;

            const keyPressed = event.keyCode;
            const goingUp = velocity.y === -1;
            const goingDown = velocity.y === 1;
            const goingRight = velocity.x === 1;
            const goingLeft = velocity.x === -1;

            if (keyPressed === LEFT_KEY && !goingRight) {
                velocity = { x: -1, y: 0 };
            }
            if (keyPressed === UP_KEY && !goingDown) {
                velocity = { x: 0, y: -1 };
            }
            if (keyPressed === RIGHT_KEY && !goingLeft) {
                velocity = { x: 1, y: 0 };
            }
            if (keyPressed === DOWN_KEY && !goingUp) {
                velocity = { x: 0, y: 1 };
            }
        }

        // Reset Game
        function resetGame() {
            clearInterval(gameInterval);
            isGameOver = false;
            isGameRunning = true;
            score = 0;
            scoreEl.textContent = score;
            gameOverScreen.style.display = 'none';
            initSnake();
            placeFood();
            gameInterval = setInterval(gameLoop, GAME_SPEED);
        }

        // Game Loop
        function gameLoop() {
            if (!isGameRunning) return;

            update();
            draw();
        }

        // Update Logic
        function update() {
            const head = { x: snake[0].x + velocity.x, y: snake[0].y + velocity.y };

            // Collision with Walls
            if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
                handleGameOver();
                return;
            }

            // Collision with Self
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    handleGameOver();
                    return;
                }
            }

            snake.unshift(head);

            // Check Food
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.textContent = score;
                placeFood();
            } else {
                snake.pop();
            }
        }

        // Drawing Logic
        function draw() {
            // Clear Screen
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Food (Neon Red/Pink)
            ctx.fillStyle = '#f0f';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#f0f';
            ctx.fillRect(food.x * TILE_SIZE, food.y * TILE_SIZE, TILE_SIZE - 1, TILE_SIZE - 1);

            // Draw Snake (Neon Green)
            ctx.fillStyle = '#0f0';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#0f0';
            
            for (let i = 0; i < snake.length; i++) {
                // Slightly lighter for head
                if (i === 0) {
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(snake[i].x * TILE_SIZE, snake[i].y * TILE_SIZE, TILE_SIZE - 1, TILE_SIZE - 1);
                } else {
                    ctx.fillStyle = '#0f0';
                    ctx.fillRect(snake[i].x * TILE_SIZE, snake[i].y * TILE_SIZE, TILE_SIZE - 1, TILE_SIZE - 1);
                }
            }
            
            // Reset shadow for performance (though minimal usage)
            ctx.shadowBlur = 0;
        }

        // Game Over
        function handleGameOver() {
            isGameOver = true;
            isGameRunning = false;
            clearInterval(gameInterval);

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                highScoreEl.textContent = highScore;
            }

            finalScoreEl.textContent = score;
            gameOverScreen.style.display = 'flex';
        }

        // Start immediately
        initSnake();
        placeFood();
        gameInterval = setInterval(gameLoop, GAME_SPEED);

    </script>
</body>
</html>
