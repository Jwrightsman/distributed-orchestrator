<!DOCTYPE html><html><body><p id="timer">25:00</p><button>Start</button><button>Pause</button><button>Reset</button><script>let n=1500,loop;const t=document.getElementById('timer');function draw(){t.textContent=Math.floor(n/60)+':'+String(n%60).padStart(2,'0')}document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{clearInterval(loop);if(b.textContent==='Start')loop=setInterval(()=>{n--;draw()},1000);if(b.textContent==='Reset'){n=1500;draw()}}));</script></body></html>
