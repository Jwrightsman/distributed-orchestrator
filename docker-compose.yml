# Distributed AI Orchestrator — one-command deployment
#
#   docker compose up -d
#   docker compose exec ollama ollama pull qwen3.5:4b
#
# The orchestrator reads settings and all recoverable state from ./data. The
# trusted-alpha preflight validates this mount before any migration runs.
# See docs/DEPLOY.md; do not run two compose projects against the same folder.
#
# To run a worker node against a remote orchestrator instead:
#   docker compose run --rm orchestrator python /app/node.py --server https://ORCHESTRATOR

services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

  orchestrator:
    build: .
    ports:
      # 127.0.0.1 is written literally, and there is deliberately no variable
      # here to override it.
      #
      # Docker does not consult ufw. A published port becomes a rule in
      # Docker's own iptables chain, which is evaluated *before* the chain ufw
      # writes into, so `ufw deny 8000` reports "deny" while the port is still
      # answering the whole Internet. An operator reading `ufw status` has no
      # way to see that. Binding the host side to loopback is the one form
      # that cannot be undone by a firewall the kernel never reaches: the
      # socket is simply not on a public interface.
      #
      # Nothing outside this host should reach the application directly.
      # Public reachability belongs to a TLS reverse proxy — see deploy/ and
      # docs/DEPLOY.md — which holds 443 and forwards here over loopback.
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data
    environment:
      MYCELIUM_STATE_DIR: /data
      MYCELIUM_CONFIG_FILE: /data/config.json
    depends_on:
      - ollama
    init: true
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  ollama-models:
