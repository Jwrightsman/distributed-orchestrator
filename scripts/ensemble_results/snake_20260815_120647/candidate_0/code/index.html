<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Snake</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        h1 {
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
            margin-bottom: 10px;
            font-size: 2rem;
            letter-spacing: 2px;
        }

        #score-container {
            margin-bottom: 15px;
            font-size: 1.2rem;
            color: #00ff00;
            text-shadow: 0 0 5px #00ff00;
        }

        canvas {
            background-color: #000;
            border: 2px solid #333;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
            border-radius: 4px;
            display: block;
        }

        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: none; /* STARTS HIDDEN */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        #game-over-text {
            font-size: 3rem;
            color: #ff0055;
            text-shadow: 0 0 20px #ff0055;
            margin-bottom: 30px;
            text-transform: uppercase;
            font-weight: bold;
        }

        #restart-btn {
            padding: 15px 40px;
            font-size: 1.5rem;
            background: transparent;
            color: #00ffff;
            border: 2px solid #00ffff;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
        }

        #restart-btn:hover {
            background-color: #00ffff;
            color: #000;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.8);
        }

        .controls-hint {
            margin-top: 20px;
            color: #555;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <h1>Neon Snake</h1>
    <div id="score-container">Score: <span id="score">0</span></div>
    
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div id="game-over">
        <div id="game-over-text">Game Over</div>
        <button id="restart-btn">Restart</button>
    </div>

    <div class="controls-hint">Use Arrow Keys to Move</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const gameOverOverlay = document.getElementById('game-over');
        const restartBtn = document.getElementById('restart-btn');

        // Game Constants
        const TILE_SIZE = 20;
        const TILE_COUNT = canvas.width / TILE_SIZE;
        const GAME_SPEED = 100; // ms

        // Game State
        let score = 0;
        let snake = [];
        let food = { x: 0, y: 0 };
        let dx = 0;
        let dy = 0;
        let nextDx = 0;
        let nextDy = 0;
        let gameInterval;
        let isGameRunning = false;
        let animationFrameId;

        // Initialize Snake in center
        function initSnake() {
            const startX = Math.floor(TILE_COUNT / 2);
            const startY = Math.floor(TILE_COUNT / 2);
            snake = [
                { x: startX, y: startY },
                { x: startX - 1, y: startY },
                { x: startX - 2, y: startY },
            ];
            // Start moving right by default if nothing else is set
            if (dx === 0 && dy === 0) {
                nextDx = 1;
                nextDy = 0;
            }
        }

        // Initialize Game State
        function initGame() {
            score = 0;
            scoreElement.textContent = score;
            
            // Reset movement direction (default to right)
            dx = 0;
            dy = 0;
            nextDx = 1;
            nextDy = 0;

            initSnake();
            placeFood();
            
            isGameRunning = true;
            gameOverOverlay.style.display = "none";
            
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, GAME_SPEED);
        }

        function placeFood() {
            let validPosition = false;
            while (!validPosition) {
                food.x = Math.floor(Math.random() * TILE_COUNT);
                food.y = Math.floor(Math.random() * TILE_COUNT);

                // Check if food spawned on snake body
                validPosition = true;
                for (let part of snake) {
                    if (part.x === food.x && part.y === food.y) {
                        validPosition = false;
                        break;
                    }
                }
            }
        }

        // Drawing Functions
        function drawRect(x, y, color, glow = false) {
            ctx.fillStyle = color;
            ctx.shadowBlur = glow ? 15 : 0;
            ctx.shadowColor = color;
            ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
            ctx.shadowBlur = 0; // Reset
        }

        function drawGame() {
            // Clear screen
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Food
            drawRect(food.x, food.y, "#ff0055", true);

            // Draw Snake
            for (let i = 0; i < snake.length; i++) {
                const part = snake[i];
                // Head is cyan, body is light green
                if (i === 0) {
                    drawRect(part.x, part.y, "#00ffff", true);
                } else {
                    drawRect(part.x, part.y, "#00ff00");
                }
            }

            updateScore();
        }

        function updateScore() {
            scoreElement.textContent = score;
        }

        // Game Loop
        function gameLoop() {
            if (!isGameRunning) return;

            // Update direction from input queue (prevents 180 turns in one frame)
            dx = nextDx;
            dy = nextDy;

            // Calculate new head position
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Collision Detection: Walls
            if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
                gameOver();
                return;
            }

            // Collision Detection: Self
            // We start from length-1 because we haven't removed the tail yet (unless we eat food)
            // However, since we are checking against the current state of snake,
            // we check if the new head overlaps with any existing part.
            for (let part of snake) {
                if (part.x === head.x && part.y === head.y) {
                    gameOver();
                    return;
                }
            }

            // Move Snake
            snake.unshift(head);

            // Check Food Collision
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                placeFood();
                // Don't pop the tail, so snake grows
            } else {
                snake.pop();
            }

            drawGame();
        }

        function gameOver() {
            isGameRunning = false;
            clearInterval(gameInterval);
            gameOverOverlay.style.display = "flex";
        }

        // Input Handling
        document.addEventListener('keydown', (e) => {
            // Prevent default scrolling for arrow keys
            if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.code) > -1) {
                e.preventDefault();
            }

            if (!isGameRunning) return;

            switch (e.key) {
                case 'ArrowUp':
                    if (dy !== 1) { nextDx = 0; nextDy = -1; }
                    break;
                case 'ArrowDown':
                    if (dy !== -1) { nextDx = 0; nextDy = 1; }
                    break;
                case 'ArrowLeft':
                    if (dx !== 1) { nextDx = -1; nextDy = 0; }
                    break;
                case 'ArrowRight':
                    if (dx !== -1) { nextDx = 1; nextDy = 0; }
                    break;
            }
        });

        // Restart Button Listener
        restartBtn.addEventListener('click', () => {
            initGame();
        });

        // Start immediately on load
        initGame();

    </script>
</body>
</html>
