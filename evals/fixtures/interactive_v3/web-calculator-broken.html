<!DOCTYPE html><html><body><output>0</output><button>2</button><button>+</button><button>3</button><button>=</button><button>C</button><script type="text/plain">let s='';const out=document.querySelector('output');document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{const v=b.textContent;if(v==='C'){s='';out.textContent='0'}else if(v==='='){out.textContent=String(s.split('+').reduce((a,n)=>a+Number(n),0))}else{s+=v;out.textContent=s}}));</script></body></html>
