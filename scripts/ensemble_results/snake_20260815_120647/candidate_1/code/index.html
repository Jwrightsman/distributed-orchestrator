<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Snake</title>
    <style>
        body {
            background-color: #050505;
            color: #fff;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }

        h1 {
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
            margin-bottom: 10px;
        }

        #score-container {
            margin-bottom: 15px;
            font-size: 1.5rem;
        }

        canvas {
            border: 2px solid #333;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.1);
            background-color: #0a0a0a;
        }

        #overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none; /* Hidden by default */
            pointer-events: none;
        }

        #overlay.active {
            display: block; /* Shown only on game over */
            pointer-events: auto;
        }

        .game-over-text {
            font-size: 3rem;
            color: #f0f;
            text-shadow: 0 0 10px #f0f, 0 0 20px #f0f;
            margin: 0 0 20px 0;
            font-weight: bold;
        }

        #restart-btn {
            background: transparent;
            border: 2px solid #0f0;
            color: #0f0;
            font-size: 1.2rem;
            padding: 10px 20px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 0 10px #0f0;
            pointer-events: auto;
        }

        #restart-btn:hover {
            background: #0f0;
            color: #000;
            box-shadow: 0 0 20px #0f0;
        }
    </style>
</head>
<body>

    <h1>Neon Snake</h1>
    <div id="score-container">Score: <span id="score">0</span></div>
    
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    
    <div id="overlay">
        <div class="game-over-text">GAME OVER</div>
        <button id="restart-btn">Restart</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const overlay = document.getElementById('overlay');
        const restartBtn = document.getElementById('restart-btn');

        const TILE_SIZE = 20;
        const TILE_COUNT = canvas.width / TILE_SIZE;
        const GAME_SPEED = 100; // ms per frame

        let score = 0;
        let velocityX = 0;
        let velocityY = 0;
        
        let snake = [];
        let food = { x: 0, y: 0 };

        let lastRenderTime = 0;
        let gameRunning = true;

        // Start moving immediately
        velocityX = 1;
        velocityY = 0;

        function initGame() {
            // Hide overlay
            overlay.classList.remove('active');
            
            // Reset snake (middle)
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            
            // Reset food
            spawnFood();
            
            // Reset stats
            score = 0;
            scoreElement.textContent = score;
            
            // Ensure start moving
            if (velocityX === 0) velocityX = 1;
            if (velocityY === 0) velocityY = 0;
            
            gameRunning = true;
            window.requestAnimationFrame(gameLoop);
        }

        function spawnFood() {
            food.x = Math.floor(Math.random() * TILE_COUNT);
            food.y = Math.floor(Math.random() * TILE_COUNT);

            // Check if food spawned on snake body
            for (let segment of snake) {
                if (segment.x === food.x && segment.y === food.y) {
                    spawnFood();
                    break;
                }
            }
        }

        function update() {
            if (!gameRunning) return;

            // Calculate new head position
            const head = { x: snake[0].x + velocityX, y: snake[0].y + velocityY };

            // Collision Detection: Walls
            if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
                gameOver();
                return;
            }

            // Collision Detection: Self
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head); // Add new head

            // Eat Food
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.textContent = score;
                spawnFood();
            } else {
                snake.pop(); // Remove tail
            }
        }

        function draw() {
            // Clear screen
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Food (Neon Red)
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#f00';
            ctx.fillStyle = '#f00';
            ctx.beginPath();
            ctx.arc(
                food.x * TILE_SIZE + TILE_SIZE / 2, 
                food.y * TILE_SIZE + TILE_SIZE / 2, 
                TILE_SIZE / 2 - 2, 
                0, Math.PI * 2
            );
            ctx.fill();

            // Draw Snake (Neon Green)
            ctx.shadowColor = '#0f0';
            ctx.fillStyle = '#0f0';
            for (let i = 0; i < snake.length; i++) {
                const x = snake[i].x * TILE_SIZE;
                const y = snake[i].y * TILE_SIZE;
                
                // Slight visual difference for head
                if (i === 0) {
                    ctx.fillStyle = '#ccffcc';
                } else {
                    ctx.fillStyle = '#0f0';
                }
                
                ctx.fillRect(x + 1, y + 1, TILE_SIZE - 2, TILE_SIZE - 2);
            }
        }

        function gameOver() {
            gameRunning = false;
            overlay.classList.add('active');
        }

        function gameLoop(timestamp) {
            if (!gameRunning) return;

            const secondsSinceLastRender = timestamp - lastRenderTime;
            if (secondsSinceLastRender > GAME_SPEED) {
                update();
                draw();
                lastRenderTime = timestamp;
            }

            window.requestAnimationFrame(gameLoop);
        }

        // Event Listeners
        window.addEventListener('keydown', e => {
            switch (e.key) {
                case 'ArrowUp':
                    if (velocityY !== 1) { velocityX = 0; velocityY = -1; }
                    break;
                case 'ArrowDown':
                    if (velocityY !== -1) { velocityX = 0; velocityY = 1; }
                    break;
                case 'ArrowLeft':
                    if (velocityX !== 1) { velocityX = -1; velocityY = 0; }
                    break;
                case 'ArrowRight':
                    if (velocityX !== -1) { velocityX = 1; velocityY = 0; }
                    break;
            }
        });

        restartBtn.addEventListener('click', initGame);

        // Initialize on load
        initGame();
    </script>
</body>
</html>
