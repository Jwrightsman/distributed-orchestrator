<!DOCTYPE html><html><body><input><button id="add">Add</button><ul></ul><script type="text/plain">let tasks=JSON.parse(localStorage.getItem('tasks')||'[]');function draw(){document.querySelector('ul').innerHTML='';tasks.forEach((task,i)=>{let li=document.createElement('li'),cb=document.createElement('input'),del=document.createElement('button');cb.type='checkbox';cb.checked=task.done;cb.addEventListener('change',()=>{task.done=cb.checked;save()});del.textContent='Delete';del.addEventListener('click',()=>{tasks.splice(i,1);save();draw()});li.append(cb,document.createTextNode(task.text),del);document.querySelector('ul').append(li)})}function save(){localStorage.setItem('tasks',JSON.stringify(tasks))}document.getElementById('add').addEventListener('click',()=>{tasks.push({text:document.querySelector('input').value,done:false});save();draw()});draw();</script></body></html>
