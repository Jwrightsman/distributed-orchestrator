<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Status — Mycelium</title>
<meta name="description" content="<!--SLOT:META_DESCRIPTION-->">
<!-- THEME -->
<style>
  /* This coordinator's status, and one machine's own page (routes_status.py
     fills both). The same facts /status.json carries, laid out for a person,
     refreshed on a timer, and honest about an empty network: nobody connected
     is a true state of a small invite-only network, not an error. Both pages
     sit behind the viewer key; only /status.json is public.
     Tokens come from _theme.html. Every tappable control is at least 44px. */

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); line-height: 1.55; -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }
  :where(a, button):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
  .skip-link {
    position: absolute; left: 8px; top: -60px; z-index: 60;
    padding: 9px 14px; border-radius: 10px;
    background: var(--surface); color: var(--text); border: 1px solid var(--border-strong);
    font-size: 13px; font-weight: 600; text-decoration: none;
  }
  .skip-link:focus { top: 8px; }

  .site-head {
    display: flex; align-items: center; gap: 10px;
    padding: 0 20px; min-height: 47px; border-bottom: 1px solid var(--border-subtle);
  }
  .brand { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; text-decoration: none; }
  .mark { width: 9px; height: 9px; background: var(--mark); }
  .wordmark { font-size: 12.5px; font-weight: 600; letter-spacing: 0.1em; color: var(--mark); }
  .head-tag { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11px; color: var(--text-muted); }
  .head-tag svg { width: 11px; height: 11px; }
  .site-links { margin-left: auto; display: flex; align-items: center; gap: 4px; font-family: var(--mono); font-size: 11.5px; }
  .site-links a {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 44px; min-width: 44px; padding: 0 8px; color: var(--text-muted); text-decoration: none;
  }
  .site-links a:hover { color: var(--text); }

  .wrap { width: 100%; max-width: 760px; margin: 0 auto; padding: 48px 24px 64px; }

  .headline { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .lamp { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; background: var(--text-muted); }
  .lamp.is-ok { background: var(--accent); box-shadow: 0 0 0 4px var(--accent-wash); }
  .lamp.is-warn { background: var(--warn); box-shadow: 0 0 0 4px var(--warn-wash); }
  .lamp.is-down { background: var(--danger); box-shadow: 0 0 0 4px var(--danger-wash); }
  h1 { font-size: clamp(22px, 5vw, 27px); font-weight: 600; letter-spacing: -0.5px; color: var(--text); overflow-wrap: anywhere; }
  h1.is-mono { font-family: var(--mono); font-weight: 500; letter-spacing: -0.3px; }
  .since { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--text-muted); }
  .sub { font-size: 14px; line-height: 1.65; color: var(--text-dim); margin-top: 11px; max-width: 46em; text-wrap: pretty; }

  .figs {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr));
    border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
    margin-top: 22px; background: var(--surface);
  }
  .fig { padding: 13px 15px; border-right: 1px solid var(--border-subtle); border-bottom: 1px solid var(--border-subtle); min-width: 0; }
  .fig .n { display: block; font-family: var(--mono); font-size: 20px; font-weight: 500; color: var(--text); overflow-wrap: anywhere; }
  .fig .n.is-live { color: var(--accent-text); }
  .fig .n.is-none { color: var(--text-muted); }
  .fig .k { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--text-muted); margin-top: 5px; }

  section { padding: 26px 0 0; }
  h2 { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); }
  .lede { font-size: 13px; color: var(--text-muted); line-height: 1.6; margin-top: 6px; }
  .empty {
    margin-top: 13px; padding: 15px 16px;
    border: 1px solid var(--border); border-radius: 10px; background: var(--surface);
    font-size: 13.5px; color: var(--text-dim); line-height: 1.65; text-wrap: pretty;
  }
  .empty b { color: var(--text); font-weight: 600; }
  .empty a { display: inline-flex; align-items: center; min-height: 44px; font-family: var(--mono); font-size: 11.5px; color: var(--text-muted); }
  .empty a:hover { color: var(--text); }
  .cmd {
    display: flex; align-items: center; gap: 9px; margin-top: 12px;
    padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-sunken);
    font-family: var(--mono); font-size: 12px; color: var(--text-dim); overflow-wrap: anywhere;
  }
  .cmd .p { color: var(--accent-text); flex-shrink: 0; }
  .table-scroll { overflow-x: auto; margin-top: 13px; border: 1px solid var(--border); border-radius: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { padding: 10px 15px; text-align: left; border-bottom: 1px solid var(--border-subtle); vertical-align: baseline; }
  tr:last-child td { border-bottom: none; }
  th { font-size: 11px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--text-muted); }
  td { color: var(--text-dim); overflow-wrap: anywhere; }
  td:first-child { color: var(--text-dim); }
  tbody tr td:first-child { font-weight: 400; }
  .mono { font-family: var(--mono); font-size: 11.5px; color: var(--text-muted); }
  .num { text-align: right; }
  .n.is-ok { color: var(--accent-text); font-family: var(--mono); font-size: 11.5px; }
  .n.is-warn { color: var(--warn-text); font-family: var(--mono); font-size: 11.5px; }
  .n.is-down { color: var(--danger-text); font-family: var(--mono); font-size: 11.5px; }
  .n.is-none { color: var(--text-muted); font-family: var(--mono); font-size: 11.5px; }
  .note {
    display: grid; grid-template-columns: 7px minmax(0, 1fr); gap: 11px; align-items: start;
    margin-top: 12px; font-size: 12.5px; color: var(--text-muted); line-height: 1.65; text-wrap: pretty;
  }
  .note::before { content: ""; width: 7px; height: 7px; margin-top: 6px; background: var(--info); }

  .site-foot {
    margin-top: 34px; padding-top: 18px; border-top: 1px solid var(--border-subtle);
    display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px;
    font-family: var(--mono); font-size: 11px; color: var(--text-muted);
  }
  .site-foot a {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 44px; min-width: 44px; color: var(--text-muted); text-decoration: none;
  }
  .site-foot a:hover { color: var(--text); }
  .theme-btn {
    margin-left: auto; display: inline-flex; align-items: center; justify-content: center;
    min-width: 44px; min-height: 44px; background: none; border: none; cursor: pointer;
    font-family: var(--mono); font-size: 11px; color: var(--text-muted);
  }
  .theme-btn span { border: 1px solid var(--border); border-radius: 10px; padding: 3px 8px; }
  .theme-btn:hover span { border-color: var(--border-strong); color: var(--text); }
  .refresh { font-family: var(--mono); font-size: 11px; color: var(--text-muted); margin-top: 8px; }
</style>
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<header class="site-head">
  <a class="brand" href="/" title="What Mycelium is"><span class="mark" aria-hidden="true"></span><span class="wordmark">MYCELIUM</span></a>
  <!--SLOT:HEAD_TAG-->
  <nav class="site-links" aria-label="Site">
    <a href="/" title="What this is">about</a>
    <a href="/try" title="Pitch one task on this machine">try it</a>
    <a href="/dashboard" title="Open the console">console</a>
  </nav>
</header>

<main id="main" class="wrap" tabindex="-1">

  <div class="headline">
    <span class="lamp <!--SLOT:LAMP_CLASS-->" aria-hidden="true"></span>
    <h1 class="<!--SLOT:HEADLINE_CLASS-->"><!--SLOT:HEADLINE--></h1>
    <span class="since"><!--SLOT:UPTIME--></span>
  </div>
  <p class="sub"><!--SLOT:SUMMARY--></p>

  <div class="figs"><!--SLOT:FIGURES--></div>

  <section aria-labelledby="h-nodes">
    <h2 id="h-nodes"><!--SLOT:NODES_TITLE--></h2>
    <p class="lede"><!--SLOT:NODES_LEDE--></p>
    <!--SLOT:NODES-->
  </section>

  <section aria-labelledby="h-recent">
    <h2 id="h-recent"><!--SLOT:RECENT_TITLE--></h2>
    <p class="lede"><!--SLOT:RECENT_LEDE--></p>
    <!--SLOT:RECENT-->
  </section>

  <section aria-labelledby="h-build">
    <h2 id="h-build">This build</h2>
    <p class="lede">A fingerprint of the source this process is running, so a deploy that silently did nothing is visible.</p>
    <!--SLOT:BUILD-->
  </section>

  <footer class="site-foot">
    <a href="/status.json" title="The machine-readable version of this page — public">/status.json</a>
    <a href="https://github.com/Jwrightsman/distributed-orchestrator" target="_blank" rel="noopener" title="The repository">source</a>
    <a href="/" title="What this is">what this is</a>
    <button class="theme-btn" id="theme-toggle" type="button" title="Switch between the dark and light themes"
            aria-label="Switch colour theme"><span><span id="theme-toggle-icon" aria-hidden="true"></span></span></button>
  </footer>
  <p class="refresh">refreshes every 15s</p>

</main>

<script>
  // The page is fully rendered by the server — this only keeps it fresh, so a
  // tab left open on a wall display does not quietly go stale. If it fails,
  // the page is still correct as of when it loaded.
  setTimeout(function () { location.reload(); }, 15000);

  // This page supplies its own theme control, so the floating one stands down.
  (function () {
    var icon = document.getElementById('theme-toggle-icon');
    function paint() {
      icon.textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '☀' : '☾';
    }
    paint();
    document.getElementById('theme-toggle').addEventListener('click', function () {
      var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      try { localStorage.setItem('mycelium-theme', next); } catch (e) {}
      document.documentElement.setAttribute('data-theme', next);
      paint();
    });
  })();
</script>
</body>
</html>
