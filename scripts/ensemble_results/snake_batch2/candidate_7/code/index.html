<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Snake</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        
        canvas {
            border: 2px solid #33ff33;
            box-shadow: 0 0 20px #33ff33, inset 0 0 10px #33ff33;
            background-color: #000000;
            display: block;
        }
        
        #scoreDisplay {
            margin-bottom: 10px;
            font-size: 24px;
            color: #33ff33;
            text-shadow: 0 0 10px #33ff33;
        }
        
        #gameOverOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        
        #gameOverText {
            font-size: 48px;
            color: #ff0055;
            text-shadow: 0 0 20px #ff0055;
            margin-bottom: 20px;
        }
        
        #finalScore {
            font-size: 24px;
            color: #ffff33;
            margin-bottom: 30px;
        }
        
        #restartBtn {
            padding: 10px 30px;
            font-size: 18px;
            font-family: inherit;
            background-color: transparent;
            color: #33ff33;
            border: 2px solid #33ff33;
            cursor: pointer;
            text-shadow: 0 0 5px #33ff33;
            transition: background-color 0.2s;
        }
        
        #restartBtn:hover {
            background-color: rgba(51, 255, 51, 0.1);
        }
    </style>
</head>
<body>
    <div id="scoreDisplay">Score: 0</div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    
    <div id="gameOverOverlay">
        <div id="gameOverText">GAME OVER</div>
        <div id="finalScore">Score: 0</div>
        <button id="restartBtn">Restart</button>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const gameOverOverlay = document.getElementById('gameOverOverlay');
            const gameOverText = document.getElementById('gameOverText');
            const finalScore = document.getElementById('finalScore');
            const restartBtn = document.getElementById('restartBtn');

            const tileCount = 20;
            const tileSize = canvas.width / tileCount;
            
            let score = 0;
            let speed = 7;
            let lastTime = 0;
            let isGameOver = false;
            
            let snake = [];
            let dx = 0;
            let dy = 0;
            let foodX = 0;
            let foodY = 0;
            
            function initGame() {
                score = 0;
                speed = 7;
                isGameOver = false;
                snake = [];
                dx = 1;
                dy = 0;
                
                snake.push({ x: 10, y: 10 });
                snake.push({ x: 9, y: 10 });
                snake.push({ x: 8, y: 10 });
                
                placeFood();
                scoreDisplay.innerText = "Score: " + score;
                gameOverOverlay.style.display = "none";
                lastTime = performance.now();
                requestAnimationFrame(gameLoop);
            }
            
            function placeFood() {
                foodX = Math.floor(Math.random() * tileCount);
                foodY = Math.floor(Math.random() * tileCount);
                
                for (let i = 0; i < snake.length; i++) {
                    if (snake[i].x === foodX && snake[i].y === foodY) {
                        placeFood();
                    }
                }
            }
            
            function draw() {
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = '#33ff33';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#33ff33';
                
                for (let i = 0; i < snake.length; i++) {
                    ctx.fillRect(snake[i].x * tileSize, snake[i].y * tileSize, tileSize - 2, tileSize - 2);
                }
                
                ctx.fillStyle = '#ff0055';
                ctx.shadowColor = '#ff0055';
                
                ctx.fillRect(foodX * tileSize, foodY * tileSize, tileSize - 2, tileSize - 2);
                
                ctx.shadowBlur = 0;
            }
            
            function update(time = 0) {
                if (isGameOver) return;
                
                const deltaTime = time - lastTime;
                lastTime = time;
                
                if (deltaTime / 1000 >= 1 / speed) {
                    const head = { x: snake[0].x + dx, y: snake[0].y + dy };
                    
                    if (head.x === foodX && head.y === foodY) {
                        score++;
                        scoreDisplay.innerText = "Score: " + score;
                        placeFood();
                    } else {
                        snake.pop();
                    }
                    
                    snake.unshift(head);
                    
                    if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                        handleGameOver();
                        return;
                    }
                    
                    for (let i = 1; i < snake.length; i++) {
                        if (snake[i].x === head.x && snake[i].y === head.y) {
                            handleGameOver();
                            return;
                        }
                    }
                }
                
                draw();
                requestAnimationFrame(update);
            }
            
            function handleGameOver() {
                isGameOver = true;
                gameOverText.innerText = "GAME OVER";
                finalScore.innerText = "Final Score: " + score;
                gameOverOverlay.style.display = "flex";
            }
            
            document.addEventListener('keydown', event => {
                if (event.key === 'ArrowUp' && dy !== 1) {
                    dx = 0;
                    dy = -1;
                } else if (event.key === 'ArrowDown' && dy !== -1) {
                    dx = 0;
                    dy = 1;
                } else if (event.key === 'ArrowLeft' && dx !== 1) {
                    dx = -1;
                    dy = 0;
                } else if (event.key === 'ArrowRight' && dx !== -1) {
                    dx = 1;
                    dy = 0;
                }
            });
            
            restartBtn.addEventListener('click', () => {
                initGame();
            });
            
            initGame();
        })();
    </script>
</body>
</html>
