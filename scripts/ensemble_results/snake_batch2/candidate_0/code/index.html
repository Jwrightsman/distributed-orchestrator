<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neon Snake</title>
<style>
    body {
        background: #111;
        color: #fff;
        font-family: 'Courier New', monospace;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        overflow: hidden;
    }
    canvas {
        border: 2px solid #333;
        background: #000;
        box-shadow: 0 0 20px rgba(0, 255, 255, 0.1);
    }
    #overlay {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        display: none;
    }
    #overlay h2 {
        font-size: 48px;
        margin: 0 0 10px 0;
        color: #f00;
        text-shadow: 0 0 10px #f00;
    }
    #overlay p {
        font-size: 18px;
        color: #ccc;
    }
    #restart-btn {
        background: #333;
        color: #0ff;
        border: 2px solid #0ff;
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        margin-top: 20px;
        outline: none;
    }
    #restart-btn:hover {
        background: #0ff;
        color: #000;
    }
    #score {
        position: absolute;
        top: 10px;
        left: 10px;
        font-size: 20px;
        color: #0ff;
        text-shadow: 0 0 10px #0ff;
    }
</style>
</head>
<body>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div id="score">Score: 0</div>
    <div id="overlay">
        <h2>GAME OVER</h2>
        <p>Press any key to restart</p>
        <button id="restart-btn">Restart Game</button>
    </div>
<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const scoreEl = document.getElementById('score');
    const restartBtn = document.getElementById('restart-btn');

    const gridSize = 20;
    const tileCount = canvas.width / gridSize;
    let speed = 7; // Frames per second (higher is faster)

    // Game State
    let snake = [];
    let velocity = { x: 0, y: 0 };
    let food = { x: 15, y: 15 };
    let score = 0;
    let isGameOver = false;
    let isPaused = false;
    let lastRenderTime = 0;
    let animationFrameId;

    // Initialize
    function init() {
        snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        velocity = { x: 1, y: 0 }; // Start moving right immediately
        score = 0;
        isGameOver = false;
        isPaused = false;
        placeFood();
        updateScore();
        overlay.style.display = 'none';
        lastRenderTime = performance.now();
        requestAnimationFrame(gameLoop);
    }

    function placeFood() {
        food.x = Math.floor(Math.random() * tileCount);
        food.y = Math.floor(Math.random() * tileCount);
        // Prevent food spawning on snake body
        for (let part of snake) {
            if (part.x === food.x && part.y === food.y) {
                placeFood();
                break;
            }
        }
    }

    function update() {
        // Movement logic
        const head = { x: snake[0].x + velocity.x, y: snake[0].y + velocity.y };

        // Collision Detection: Walls
        if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
            gameOver();
            return;
        }

        // Collision Detection: Self
        for (let i = 0; i < snake.length; i++) {
            if (head.x === snake[i].x && head.y === snake[i].y) {
                gameOver();
                return;
            }
        }

        snake.unshift(head); // Add new head

        // Food Collision
        if (head.x === food.x && head.y === food.y) {
            score += 10;
            updateScore();
            placeFood();
            // Don't pop the tail, so snake grows
        } else {
            snake.pop(); // Remove tail
        }
    }

    function draw() {
        // Clear screen
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw Food
        ctx.fillStyle = '#f00';
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#f00';
        ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);

        // Draw Snake
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#0ff';
        snake.forEach((part, index) => {
            ctx.fillStyle = index === 0 ? '#fff' : '#0ff';
            ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
        });
    }

    function gameLoop(timestamp) {
        if (isPaused) return;

        // Calculate time delta to control speed
        const deltaTime = timestamp - lastRenderTime;
        
        // Throttle updates based on speed variable
        if (deltaTime >= (1000 / speed)) {
            update();
            lastRenderTime = timestamp;
        }

        draw();
        if (!isGameOver) {
            animationFrameId = requestAnimationFrame(gameLoop);
        }
    }

    function gameOver() {
        isGameOver = true;
        isPaused = true;
        overlay.style.display = 'block';
        cancelAnimationFrame(animationFrameId);
    }

    function restartGame() {
        init();
    }

    function updateScore() {
        scoreEl.innerText = 'Score: ' + score;
    }

    // Controls
    document.addEventListener('keydown', (event) => {
        // Prevent default scrolling for arrow keys
        if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(event.code) > -1) {
            event.preventDefault();
        }

        // Restart shortcut (only if game over)
        if (isGameOver && overlay.style.display !== 'none') {
            if (event.keyCode === 13 || event.keyCode === 32) {
                restartGame();
            }
        }

        if (isGameOver) {
            restartGame();
            return;
        }

        switch (event.keyCode) {
            case 37: // Left
                if (velocity.x !== 1) {
                    velocity = { x: -1, y: 0 };
                }
                break;
            case 38: // Up
                if (velocity.y !== 1) {
                    velocity = { x: 0, y: -1 };
                }
                break;
            case 39: // Right
                if (velocity.x !== -1) {
                    velocity = { x: 1, y: 0 };
                }
                break;
            case 40: // Down
                if (velocity.y !== -1) {
                    velocity = { x: 0, y: 1 };
                }
                break;
        }
    });

    restartBtn.addEventListener('click', restartGame);

    // Start immediately
    init();

</script>
</body>
</html>
