# Distributed AI Orchestrator — one-command deployment
#
#   docker compose up -d
#   docker compose exec ollama ollama pull qwen3.5:4b
#
# The orchestrator reads settings and all recoverable state from ./data. The
# trusted-alpha preflight validates this mount before any migration runs.
# See docs/DEPLOY.md; do not run two compose projects against the same folder.
#
# To run a worker node against a remote orchestrator instead:
#   docker compose run --rm orchestrator python /app/node.py --server http://ORCHESTRATOR:8000

services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

  orchestrator:
    build: .
    ports:
      # Loopback is the safe default. Set MYCELIUM_PUBLISH_ADDRESS to a private
      # overlay address (or a restricted reverse-proxy interface), never an
      # unrestricted public interface without TLS and network policy.
      - "${MYCELIUM_PUBLISH_ADDRESS:-127.0.0.1}:8000:8000"
    volumes:
      - ./data:/data
    environment:
      MYCELIUM_STATE_DIR: /data
      MYCELIUM_CONFIG_FILE: /data/config.json
    depends_on:
      - ollama
    init: true
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  ollama-models:
