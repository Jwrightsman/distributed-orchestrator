<!DOCTYPE html>
<html>
<head>
    <title>Neon Snake</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        
        h1 {
            text-shadow: 0 0 10px #0f0;
            color: #0f0;
            margin-bottom: 10px;
        }
        
        #score-board {
            font-size: 24px;
            margin-bottom: 20px;
            color: #ff0;
            text-shadow: 0 0 5px #f00;
        }
        
        #game-board {
            border: 4px solid #0f0;
            box-shadow: 0 0 20px #0f0;
            background-color: #000;
        }
        
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            background-color: rgba(0, 0, 0, 0.9);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        
        #overlay h2 {
            font-size: 48px;
            color: #f00;
            text-shadow: 0 0 20px #f00;
            margin-bottom: 30px;
        }
        
        #restart-btn {
            padding: 15px 30px;
            font-size: 20px;
            background-color: #0f0;
            color: #000;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            font-family: inherit;
            font-weight: bold;
        }
        
        #restart-btn:hover {
            background-color: #fff;
            box-shadow: 0 0 15px #fff;
        }
    </style>
</head>
<body>

    <h1>NEON SNAKE</h1>
    <div id="score-board">Score: 0</div>
    <canvas id="game-board" width="400" height="400"></canvas>
    
    <div id="overlay">
        <h2>GAME OVER</h2>
        <button id="restart-btn">Restart Game</button>
    </div>

    <script>
        // Configuration
        const CANVAS_BORDER_COLOR = '#0f0';
        const CANVAS_BACKGROUND_COLOR = '#000';
        const SNAKE_BORDER_COLOR = '#0f0';
        const SNAKE_BODY_BORDER_COLOR = '#00ff00';
        const SNAKE_BODY_BACKGROUND_COLOR = '#003300';
        const FOOD_BORDER_COLOR = '#f0f';
        const FOOD_BACKGROUND_COLOR = '#330033';
        
        const GAME_SPEED = 100;
        
        let snake = [];
        let score = 0;
        let changingDirection = false;
        let food_x;
        let food_y;
        let dx = 5;
        let dy = 0;
        let gameBoard;
        let gameRunning = false;
        
        // DOM Elements
        const canvas = document.getElementById('game-board');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const restartBtn = document.getElementById('restart-btn');
        const scoreBoard = document.getElementById('score-board');
        
        // Start the game loop immediately
        gameLoop();
        
        // Initial Game State Setup
        function initGame() {
            score = 0;
            dx = 5;
            dy = 0;
            changingDirection = false;
            gameBoard = ctx.createImageData(400, 400);
            createFood();
            scoreBoard.innerHTML = 'Score: ' + score;
            
            // Initial snake position (center-ish)
            snake = [
                {x: 200, y: 200},
                {x: 195, y: 200},
                {x: 190, y: 200},
                {x: 185, y: 200},
                {x: 180, y: 200}
            ];
            
            // Draw initial state
            drawGame();
            
            // Hide game over screen
            overlay.style.display = 'none';
        }
        
        initGame();
        
        // Game Loop
        function gameLoop() {
            if (didGameEnd()) {
                gameOver();
                return;
            }
            
            changingDirection = false;
            
            const newFood = {x: 0, y: 0};
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            
            checkSnakeCollision(head);
            checkFoodCollision(newFood);
            
            snake.unshift(head);
            
            drawGame();
            
            setTimeout(gameLoop, GAME_SPEED);
        }
        
        // Check if snake hit self or walls
        function didGameEnd() {
            // Self collision
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) {
                    return true;
                }
            }
            // Wall collision
            if (head.x < 0 || head.x >= 400 || head.y < 0 || head.y >= 400) {
                return true;
            }
            return false;
        }
        
        // Check collision with food
        function checkFoodCollision(food) {
            if (food.x === head.x && food.y === head.y) {
                score += 10;
                scoreBoard.innerHTML = 'Score: ' + score;
                createFood();
            }
        }
        
        // Check collision with self or walls
        function checkSnakeCollision(head) {
            if (didGameEnd()) {
                gameRunning = false;
            }
        }
        
        // Create food at random location
        function createFood() {
            food_x = Math.floor(Math.random() * 400);
            food_y = Math.floor(Math.random() * 400);
        }
        
        // Draw the game
        function drawGame() {
            // Draw background
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            ctx.putImageData(gameBoard, 0, 0);
            
            // Draw food
            ctx.fillStyle = '#f0f';
            ctx.fillRect(food_x, food_y, 10, 10);
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#f0f';
            
            // Draw snake
            for (let i = 0; i < snake.length; i++) {
                const snakeX = snake[i].x;
                const snakeY = snake[i].y;
                
                // Head is green, body is slightly darker
                const isHead = (i === 0);
                ctx.fillStyle = '#00ff00';
                ctx.shadowBlur = isHead ? 20 : 10;
                ctx.shadowColor = '#00ff00';
                
                ctx.fillRect(snakeX, snakeY, 10, 10);
                
                // Reset shadow
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#000';
                ctx.strokeRect(snakeX, snakeY, 10, 10);
            }
        }
        
        // Game Over
        function gameOver() {
            gameRunning = false;
            overlay.style.display = 'flex';
        }
        
        // Restart
        restartBtn.addEventListener('click', () => {
            initGame();
        });
        
        // Controls
        document.addEventListener('keydown', changeDirection);
        
        function changeDirection(event) {
            const keyPressed = event.keyCode;
            const LEFT = 37;
            const UP = 38;
            const RIGHT = 39;
            const DOWN = 40;
            
            if (keyPressed === LEFT || keyPressed === RIGHT || keyPressed === UP || keyPressed === DOWN) {
                if (changingDirection) return;
                changingDirection = true;
                
                const goingUp = (dy === -5);
                const goingDown = (dy === 5);
                const goingRight = (dx === 5);
                const goingLeft = (dx === -5);
                
                if (keyPressed === LEFT && !goingRight) {
                    dx = -5;
                    dy = 0;
                }
                
                if (keyPressed === UP && !goingDown) {
                    dx = 0;
                    dy = -5;
                }
                
                if (keyPressed === RIGHT && !goingLeft) {
                    dx = 5;
                    dy = 0;
                }
                
                if (keyPressed === DOWN && !goingUp) {
                    dx = 0;
                    dy = 5;
                }
            }
        }
    </script>
</body>
</html>
