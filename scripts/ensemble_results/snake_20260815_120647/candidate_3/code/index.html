<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Snake Game</title>
    <style>
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            border: 4px solid #333;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
            background-color: #000;
        }

        canvas {
            display: block;
        }

        #score-board {
            margin-bottom: 10px;
            font-size: 24px;
            font-weight: bold;
            color: #0ff;
            text-shadow: 0 0 10px #0ff;
        }

        #game-over-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: none; /* Starts hidden */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        #game-over-text {
            font-size: 48px;
            font-weight: bold;
            color: #f00;
            text-shadow: 0 0 20px #f00;
            margin-bottom: 20px;
            text-align: center;
        }

        #final-score {
            font-size: 24px;
            color: #fff;
            margin-bottom: 30px;
        }

        #restart-btn {
            background-color: transparent;
            border: 2px solid #0f0;
            color: #0f0;
            padding: 10px 30px;
            font-size: 18px;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            box-shadow: 0 0 10px #0f0;
            transition: all 0.2s ease;
        }

        #restart-btn:hover {
            background-color: #0f0;
            color: #000;
        }
    </style>
</head>
<body>

    <div id="score-board">SCORE: 0</div>
    
    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        
        <!-- Single Overlay for Game Over -->
        <div id="game-over-overlay" style="display:none;">
            <div id="game-over-text">GAME OVER</div>
            <div id="final-score">Score: 0</div>
            <button id="restart-btn">RESTART GAME</button>
        </div>
    </div>

    <script>
        // Game Configuration
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score-board');
        const overlay = document.getElementById('game-over-overlay');
        const restartBtn = document.getElementById('restart-btn');
        const finalScoreElement = document.getElementById('final-score');

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        
        // Game State
        let snake = [];
        let food = { x: 0, y: 0 };
        let velocity = { x: 0, y: 0 };
        let score = 0;
        let gameRunning = false;
        let gameLoopId;

        // Colors
        const COLOR_SNAKE_HEAD = '#0ff'; // Cyan
        const COLOR_SNAKE_BODY = '#088'; // Dark Cyan
        const COLOR_FOOD = '#f0f'; // Magenta
        const COLOR_GRID = '#111';

        // Initialize Game
        function initGame() {
            // Reset State
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            velocity = { x: 1, y: 0 }; // Start moving right
            score = 0;
            gameRunning = true;
            
            // Update UI
            scoreElement.innerText = `SCORE: ${score}`;
            overlay.style.display = 'none';
            
            // Start movement
            moveSnake();
        }

        // Place Food randomly
        function placeFood() {
            let validPosition = false;
            while (!validPosition) {
                food.x = Math.floor(Math.random() * tileCount);
                food.y = Math.floor(Math.random() * tileCount);

                // Ensure food doesn't spawn on snake
                validPosition = true;
                for (let part of snake) {
                    if (part.x === food.x && part.y === food.y) {
                        validPosition = false;
                        break;
                    }
                }
            }
        }

        // Core Game Logic
        function moveSnake() {
            if (!gameRunning) return;

            // Calculate new head position
            const head = { 
                x: snake[0].x + velocity.x, 
                y: snake[0].y + velocity.y 
            };

            // Check Collision with Walls
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }

            // Check Collision with Self
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver();
                    return;
                }
            }

            // Move Snake (Add new head)
            snake.unshift(head);

            // Check Food Collision
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.innerText = `SCORE: ${score}`;
                placeFood();
                // Don't pop the tail, so snake grows
            } else {
                snake.pop(); // Remove tail
            }

            drawGame();
            gameLoopId = requestAnimationFrame(moveSnake);
        }

        // Drawing Functions
        function drawGame() {
            // Clear Screen
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Grid (Optional, subtle effect)
            ctx.strokeStyle = COLOR_GRID;
            ctx.lineWidth = 1;
            for (let i = 0; i < tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }

            // Draw Food
            ctx.fillStyle = COLOR_FOOD;
            ctx.shadowBlur = 15;
            ctx.shadowColor = COLOR_FOOD;
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
            ctx.shadowBlur = 0; // Reset shadow for body

            // Draw Snake
            for (let i = 0; i < snake.length; i++) {
                // Head is bright, body is dimmer
                ctx.fillStyle = (i === 0) ? COLOR_SNAKE_HEAD : COLOR_SNAKE_BODY;
                ctx.shadowBlur = (i === 0) ? 15 : 0;
                ctx.shadowColor = COLOR_SNAKE_BODY;
                ctx.fillRect(snake[i].x * gridSize, snake[i].y * gridSize, gridSize - 2, gridSize - 2);
            }
        }

        // Game Over Logic
        function gameOver() {
            gameRunning = false;
            cancelAnimationFrame(gameLoopId);
            
            // Show Overlay
            overlay.style.display = 'flex';
            finalScoreElement.innerText = `FINAL SCORE: ${score}`;
        }

        // Input Handling
        document.addEventListener('keydown', (e) => {
            // Prevent scrolling with arrow keys
            if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.code) > -1) {
                e.preventDefault();
            }

            switch(e.key) {
                case 'ArrowUp':
                    if (velocity.y === 0) {
                        velocity = { x: 0, y: -1 };
                    }
                    break;
                case 'ArrowDown':
                    if (velocity.y === 0) {
                        velocity = { x: 0, y: 1 };
                    }
                    break;
                case 'ArrowLeft':
                    if (velocity.x === 0) {
                        velocity = { x: -1, y: 0 };
                    }
                    break;
                case 'ArrowRight':
                    if (velocity.x === 0) {
                        velocity = { x: 1, y: 0 };
                    }
                    break;
            }
        });

        // Restart Handler
        restartBtn.addEventListener('click', () => {
            initGame();
        });

        // Start the game immediately on load
        initGame();

    </script>
</body>
</html>
