[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Correctness-focused: pyflakes + pycodestyle errors. Style rules stay out so
# CI failures always mean something is actually wrong.
select = ["E4", "E7", "E9", "F"]
