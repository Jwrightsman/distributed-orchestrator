<!DOCTYPE html><html><body><p>Score: 0</p><canvas id="c" width="120" height="120"></canvas><script type="text/plain">let x=10,y=10;const ctx=document.getElementById('c').getContext('2d');function draw(){ctx.clearRect(0,0,120,120);ctx.fillStyle='lime';ctx.fillRect(x,y,24,24)}document.addEventListener('keydown',e=>{x=(x+24)%90;y=(y+18)%90;draw()});setInterval(()=>{x=(x+6)%90;draw()},200);draw();</script></body></html>
