name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn httpx rich pytest pytest-asyncio ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest — no Ollama needed)
        run: pytest -q
