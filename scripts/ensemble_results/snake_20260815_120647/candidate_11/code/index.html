<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Snake</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            border: 2px solid #333;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
        }

        canvas {
            background-color: #000000;
            display: block;
            box-shadow: 0 0 10px #00ff00;
        }

        #ui-layer {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #00ff00;
            text-shadow: 0 0 5px #00ff00;
            font-size: 20px;
            font-weight: bold;
            z-index: 2;
        }

        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 3;
        }

        #game-over-screen h1 {
            color: #ff0000;
            font-size: 48px;
            margin: 0 0 20px 0;
            text-shadow: 0 0 10px #ff0000;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        #restart-btn {
            background-color: transparent;
            color: #00ff00;
            border: 2px solid #00ff00;
            padding: 10px 20px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 10px #00ff00;
        }

        #restart-btn:hover {
            background-color: #00ff00;
            color: #000;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div id="ui-layer">Score: 0</div>
        <div id="game-over-screen">
            <h1>Game Over</h1>
            <button id="restart-btn">Restart Game</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const uiLayer = document.getElementById('ui-layer');
        const gameOverScreen = document.getElementById('game-over-screen');
        const restartBtn = document.getElementById('restart-btn');
        const scoreElement = document.getElementById('ui-layer');

        const TILE_SIZE = 20;
        const TILE_COUNT = canvas.width / TILE_SIZE;
        const BASE_SPEED = 100; // milliseconds

        let snake = [];
        let food = { x: 0, y: 0 };
        let velocity = { x: 0, y: 0 };
        let nextVelocity = { x: 0, y: 0 };
        let score = 0;
        let gameInterval = null;
        let isGameRunning = false;

        // Initialize game state
        function initGame() {
            snake = [
                { x: 10, y: 10 },
                { x: 10, y: 11 },
                { x: 10, y: 12 }
            ];
            velocity = { x: 0, y: -1 };
            nextVelocity = { x: 0, y: -1 };
            score = 0;
            placeFood();
            updateScore();
            isGameRunning = true;
            
            // Start the game loop immediately
            clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, BASE_SPEED);
            
            // Hide overlay on restart
            gameOverScreen.style.display = 'none';
        }

        function placeFood() {
            let validPosition = false;
            while (!validPosition) {
                food.x = Math.floor(Math.random() * TILE_COUNT);
                food.y = Math.floor(Math.random() * TILE_COUNT);

                // Ensure food doesn't spawn on snake
                validPosition = true;
                for (let part of snake) {
                    if (part.x === food.x && part.y === food.y) {
                        validPosition = false;
                        break;
                    }
                }
            }
        }

        function gameLoop() {
            if (!isGameRunning) return;

            // Update velocity
            velocity = nextVelocity;

            // Calculate new head position
            const head = { x: snake[0].x + velocity.x, y: snake[0].y + velocity.y };

            // Check collisions with walls
            if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
                gameOver();
                return;
            }

            // Check collisions with self
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver();
                    return;
                }
            }

            // Move snake
            snake.unshift(head);

            // Check if food eaten
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                updateScore();
                placeFood();
                // Don't pop the tail, so snake grows
            } else {
                snake.pop();
            }
            
            // Clear canvas with black
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Snake
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#00ff00';
            ctx.fillStyle = '#00ff00';
            for (let part of snake) {
                ctx.fillRect(part.x * TILE_SIZE, part.y * TILE_SIZE, TILE_SIZE - 2, TILE_SIZE - 2);
            }

            // Draw Food
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ff0000';
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(food.x * TILE_SIZE, food.y * TILE_SIZE, TILE_SIZE - 2, TILE_SIZE - 2);

            // Reset shadow for performance
            ctx.shadowBlur = 0;
        }

        function gameOver() {
            isGameRunning = false;
            clearInterval(gameInterval);
            gameOverScreen.style.display = 'flex';
        }

        function updateScore() {
            scoreElement.textContent = `Score: ${score}`;
        }

        function handleInput(e) {
            if (!isGameRunning) return;

            switch(e.key) {
                case 'ArrowUp':
                    if (velocity.y !== 1) nextVelocity = { x: 0, y: -1 };
                    break;
                case 'ArrowDown':
                    if (velocity.y !== -1) nextVelocity = { x: 0, y: 1 };
                    break;
                case 'ArrowLeft':
                    if (velocity.x !== 1) nextVelocity = { x: -1, y: 0 };
                    break;
                case 'ArrowRight':
                    if (velocity.x !== -1) nextVelocity = { x: 1, y: 0 };
                    break;
            }
        }

        // Event Listeners
        document.addEventListener('keydown', handleInput);
        restartBtn.addEventListener('click', initGame);

        // Start the game immediately on load
        initGame();

    </script>
</body>
</html>
