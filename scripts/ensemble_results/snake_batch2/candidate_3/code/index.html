<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Snake</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Courier New', Courier, monospace;
        }
        h1 {
            text-shadow: 0 0 10px #0ff;
            margin-bottom: 10px;
        }
        .game-container {
            border: 2px solid #333;
            box-shadow: 0 0 20px #0ff;
        }
        canvas {
            background-color: #000;
            box-shadow: inset 0 0 20px #000;
            display: block;
            margin: 0 auto;
        }
        #score {
            font-size: 20px;
            margin-top: 10px;
            color: #ff0;
            text-shadow: 0 0 5px #ff0;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        #game-over-text {
            font-size: 40px;
            color: #f00;
            text-shadow: 0 0 20px #f00;
            margin-bottom: 30px;
        }
        #restart-btn {
            padding: 10px 20px;
            font-size: 18px;
            background-color: transparent;
            color: #0ff;
            border: 2px solid #0ff;
            cursor: pointer;
            box-shadow: 0 0 10px #0ff;
            font-family: 'Courier New', Courier, monospace;
            text-transform: uppercase;
            transition: all 0.2s;
        }
        #restart-btn:hover {
            background-color: #0ff;
            color: #000;
        }
    </style>
</head>
<body>

    <h1>NEON SNAKE</h1>
    <div class="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div id="overlay">
            <div id="game-over-text">GAME OVER</div>
            <button id="restart-btn">Restart</button>
        </div>
    </div>
    <div id="score">Score: 0</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const restartBtn = document.getElementById('restart-btn');
        const scoreElement = document.getElementById('score');

        const TILE_SIZE = 20;
        const TILE_COUNT = canvas.width / TILE_SIZE;
        const GAME_SPEED = 100; // ms

        let score = 0;
        let velocity = { x: 0, y: 0 };
        let snake = [];
        let food = { x: 0, y: 0 };
        let gameInterval = null;
        let isGameOver = false;

        function initGame() {
            snake = [{ x: 10, y: 10 }];
            velocity = { x: 0, y: 0 };
            score = 0;
            isGameOver = false;
            scoreElement.innerText = `Score: ${score}`;
            overlay.style.display = 'none';
            placeFood();
            
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, GAME_SPEED);
        }

        function gameLoop() {
            if (isGameOver) return;

            // Move Snake
            const head = { ...snake[0] };
            head.x += velocity.x;
            head.y += velocity.y;

            // Collision Detection (Walls)
            if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
                endGame();
                return;
            }

            // Collision Detection (Self)
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    endGame();
                    return;
                }
            }

            snake.unshift(head);

            // Check Food
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.innerText = `Score: ${score}`;
                placeFood();
            } else {
                snake.pop();
            }

            draw();
        }

        function draw() {
            // Clear Screen
            ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Food
            ctx.fillStyle = '#f00';
            ctx.shadowColor = '#f00';
            ctx.shadowBlur = 10;
            ctx.fillRect(food.x * TILE_SIZE, food.y * TILE_SIZE, TILE_SIZE - 2, TILE_SIZE - 2);

            // Draw Snake
            ctx.fillStyle = '#0ff';
            ctx.shadowColor = '#0ff';
            ctx.shadowBlur = 10;
            for (let i = 0; i < snake.length; i++) {
                // Head is brighter
                if (i === 0) ctx.fillStyle = '#fff';
                else ctx.fillStyle = '#0ff';
                
                ctx.fillRect(snake[i].x * TILE_SIZE, snake[i].y * TILE_SIZE, TILE_SIZE - 2, TILE_SIZE - 2);
            }
            
            // Reset shadow for performance
            ctx.shadowBlur = 0;
        }

        function placeFood() {
            food.x = Math.floor(Math.random() * TILE_COUNT);
            food.y = Math.floor(Math.random() * TILE_COUNT);

            // Don't place food on snake body
            for (let part of snake) {
                if (part.x === food.x && part.y === food.y) {
                    placeFood();
                }
            }
        }

        function endGame() {
            if (isGameOver) return;
            isGameOver = true;
            clearInterval(gameInterval);
            overlay.style.display = 'flex';
        }

        function restartGame() {
            initGame();
        }

        // Controls
        document.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowUp':
                    if (velocity.y !== 0) break; // Prevent reversing
                    velocity = { x: 0, y: -1 };
                    break;
                case 'ArrowDown':
                    if (velocity.y !== 0) break;
                    velocity = { x: 0, y: 1 };
                    break;
                case 'ArrowLeft':
                    if (velocity.x !== 0) break;
                    velocity = { x: -1, y: 0 };
                    break;
                case 'ArrowRight':
                    if (velocity.x !== 0) break;
                    velocity = { x: 1, y: 0 };
                    break;
            }
            
            if (!isGameOver && (velocity.x !== 0 || velocity.y !== 0)) {
                draw();
            }
        });

        restartBtn.addEventListener('click', restartGame);

        // Start the game immediately
        initGame();

    </script>
</body>
</html>
